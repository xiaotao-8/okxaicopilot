name: OKXAICopilot
options:
  bundleIdPrefix: com.okxai
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
targets:
  OKXAICopilot:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Models
      - path: Sources/Core
      - path: Sources/Services
      - path: Sources/Features
    dependencies:
      - target: OKXWidgetExtension
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: 欧易AI跟单
        CFBundleShortVersionString: "1.0.0"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
  OKXWidgetExtension:
    type: app-extension
    platform: iOS
    bundleId: com.okxai.OKXAICopilot.OKXWidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.okxai.OKXAICopilot.OKXWidgetExtension
    sources:
      - path: Sources/Widget
      - path: Sources/Models
      - path: Sources/Core
    info:
      path: Sources/Widget/Info.plist
      properties:
        CFBundleDisplayName: 欧易行情
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
