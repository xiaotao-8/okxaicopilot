workflows:
  # 模拟器构建 + 启动截图验证。工程用 XcodeGen 生成（project.yml），
  # 首次构建须先跑 xcodegen。
  okxai-simulator:
    name: OKXAICopilot · simulator build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "OKXAICopilot.xcodeproj"
        XCODE_SCHEME: "OKXAICopilot"
    cache:
      cache_paths:
        - $HOME/Library/Caches/org.swift.swiftpm
        - $HOME/Library/Developer/Xcode/DerivedData
    scripts:
      - name: 生成工程（XcodeGen）
        script: |
          set -e
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate
          ls -la "$XCODE_PROJECT"
      - name: Build for the simulator
        script: |
          set -e
          mkdir -p build
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty || xcodebuild build -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Package the .app
        script: |
          set -e
          cd build/Build/Products/Debug-iphonesimulator
          zip -qry OKXAICopilot-simulator.zip OKXAICopilot.app
          cp OKXAICopilot-simulator.zip "$CM_BUILD_DIR/OKXAICopilot-simulator.zip"
      - name: 模拟器验证（安装+启动+截图）
        script: |
          set -e
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for rt,devs in d['devices'].items():
              if 'iOS' not in rt: continue
              for dev in devs:
                  if 'iPhone' in dev['name'] and dev.get('isAvailable', True):
                      print(dev['udid']); raise SystemExit
          ")
          echo "simulator: $UDID"
          if [ -z "$UDID" ]; then echo "no available iPhone simulator on this machine"; exit 1; fi
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$CM_BUILD_DIR/build/Build/Products/Debug-iphonesimulator/OKXAICopilot.app"
          xcrun simctl launch "$UDID" com.okxai.OKXAICopilot
          sleep 8
          xcrun simctl io "$UDID" screenshot "$CM_EXPORT_DIR/okxai-launch.png"
          sleep 4
          xcrun simctl io "$UDID" screenshot "$CM_EXPORT_DIR/okxai-launch-2.png"
          echo "verify done"
    artifacts:
      - OKXAICopilot-simulator.zip
      - build/Build/Products/Debug-iphonesimulator/OKXAICopilot.app
      - /tmp/xcodebuild_logs/*.log

  # 真机未签名 IPA —— 免费个人签名（SideKite）重签后安装，无需开发者账号
  okxai-unsigned:
    name: OKXAICopilot (Unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: OKXAICopilot.xcodeproj
        XCODE_SCHEME: OKXAICopilot
    scripts:
      - name: 生成工程（XcodeGen）
        script: |
          set -e
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate
      - name: 构建真机未签名版
        script: |
          set -e
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: 打包未签名 IPA
        script: |
          set -e
          mkdir -p "$CM_EXPORT_DIR/Payload"
          cp -r "$CM_BUILD_DIR/build/Build/Products/Release-iphoneos/OKXAICopilot.app" "$CM_EXPORT_DIR/Payload/"
          cd "$CM_EXPORT_DIR" && zip -rq OKXAICopilot-unsigned.ipa Payload
          ls -la "$CM_EXPORT_DIR"
    artifacts:
      - $CM_EXPORT_DIR/OKXAICopilot-unsigned.ipa
